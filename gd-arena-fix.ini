[display]
; Supported Width/Height pairs: 1280x720, 1920x1080, 2560x1440, 3840x2160.
; The main screen renders at this resolution. Restart to apply changes.
Width=1920
Height=1080
Refresh=120
; Refresh selects the display rate and high-refresh timing fixes (e.g. 60, 120, 144, 240).
; Fullscreen requires display support; in windowed mode match the desktop refresh rate.
; 1 disables optional left/right Live2D cabinet characters. Restart to apply.
; Set this and DisableSideCompositing to 0 to follow the game's character settings.
; Saved selections are retained.
DisableLive2D=1
; 1 skips side video/effect compositing for the unused LEFT/RIGHT screens and
; suppresses their optional characters. Other side-canvas render work remains.
DisableSideCompositing=1
; Above 60 Hz: 0 unchanged, 1 correct supported animation speed,
; 2 also interpolate supported native animation transforms and fades.
AnimationTiming=2
; Extra note/selection logging and Ctrl+Shift+F8 screenshots. Leave off for normal play.
Diagnostics=0
; Smooth GuitarFreaks and DrumMania note motion above 60 Hz, anchored to song time.
; Audio and hit judgment are unchanged. 0 draws directly from reported song positions.
NoteSmoothing=1
