[display]
Width=1920
Height=1080
Refresh=120
FPS=120
; Above 60 FPS, match Refresh and FPS (e.g. 120, 144, 240) and keep Experimental=1.
Experimental=1
; 1 disables optional left/right Live2D cabinet characters. Restart to apply.
; 0 follows the game's character settings. Saved selections are retained.
DisableLive2D=0
; Above 60 FPS: 0 unchanged, 1 correct supported animation speed,
; 2 also interpolate supported native animation transforms and fades.
AnimationTiming=2
; Extra note logging and Ctrl+Shift+F8 screenshots. Leave off for normal play.
Diagnostics=0
